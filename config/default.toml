[scan]
max_file_size_mb = 512
thread_count = 0  # 0 = auto-detect CPU cores
engines = ["signature", "heuristic", "ml", "static"]
excluded_paths = []
excluded_extensions = [".iso", ".vmdk", ".vhd"]

[scan.quick]
targets = ["~/Downloads", "~/Desktop", "/tmp"]

[quarantine]
vault_path = "~/.mjolnir/quarantine"
max_vault_size_mb = 2048

[realtime]
enabled = true
watch_paths = ["~/Downloads", "~/Desktop", "/tmp"]
excluded_paths = ["~/.mjolnir", "/proc", "/sys"]

[update]
auto_update = true
check_interval_hours = 6
server_url = "https://updates.mjolnir.local/api/v1"

[logging]
level = "info"
file = "~/.mjolnir/mjolnir.log"
