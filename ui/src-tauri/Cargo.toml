[package]
name = "mjolnir-desktop"
version = "0.1.0"
description = "Mjolnir - Cross-platform antivirus with quantum-enhanced detection"
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
tracing = "0.1"

# Mjolnir crates
mjolnir-core = { path = "../../crates/mjolnir-core" }
mjolnir-scanner = { path = "../../crates/mjolnir-scanner" }
mjolnir-quarantine = { path = "../../crates/mjolnir-quarantine" }
mjolnir-monitor = { path = "../../crates/mjolnir-monitor" }
mjolnir-updater = { path = "../../crates/mjolnir-updater" }
uuid = { version = "1.6", features = ["v4"] }
